[project]
name = "fichero-printer"
version = "0.1.0"
description = "Fichero D11s thermal label printer - BLE, Classic Bluetooth and USB CLI tool"
requires-python = ">=3.10"
dependencies = [
    "bleak",
    "numpy",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fichero"]

[project.scripts]
fichero = "fichero.cli:main"

[project.optional-dependencies]
usb = ["pyusb>=1.2.1"]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
